            </div>

            <aside class="game-sidebar">
                <div class="current-piece-section">
                    <h3>Current Piece</h3>
                    <div class="piece-container">
                        <div class=\"piece-preview\" id=\"piecePreview">
                            <div class="piece-preview-grid">
                                <div class="piece-cell terrain-type-water" data-row="0" data-col="0"></div>
                                <div class="piece-cell terrain-type-water" data-row="0" data-col="1"></div>
                                <div class="piece-cell terrain-type-water" data-row="0" data-col="2"></div>
                                <div class="piece-cell" data-row="1" data-col="0"></div>
                                <div class="piece-cell" data-row="1" data-col="1"></div>
                                <div class="piece-cell" data-row="1" data-col="2"></div>
                                <div class="piece-cell" data-row="2" data-col="0"></div>
                                <div class="piece-cell" data-row="2" data-col="1"></div>
                                <div class="piece-cell" data-row="2" data-col="2"></div>
                            </div>
                        </div>
                        <div class="piece-info">
                            <span class="piece-time">Time: <span id="pieceTime">2</span></span>
                            <span class="piece-type">Type: <span id="pieceType">water</span></span>
                        </div>
                    </div>
                    <div class="piece-controls">
                        <button class="control-btn" id="rotateBtn">🔄 Rotate</button>
                        <button class="control-btn" id="flipBtn">↔️ Flip</button>
                    </div>
                </div>
            </aside>
        </main>

    </div>
</body>
</html>
