<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth Game - Single Table</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="table-container">
        <div class="game-wrapper">
            <h1 class="game-title">🎯 Labyrinth Game</h1>
            
            <div class="extra-element-container">
                <div class="extra-element" id="extraElement"></div>
                <button class="rotate-btn">🔄 Rotate</button>
            </div>
            
            <table class="game" id="gameTable">
                <tr>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="bottom right"></td>
                    <td class="left top right"></td>
                    <td class="left bottom right"></td>
                    <td class="top bottom"></td>
                    <td class="left bottom right"></td>
                    <td class="left bottom"></td>
                    <td class="left bottom"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="left top right"></td>
                    <td class="top bottom"></td>
                    <td class="left bottom"></td>
                    <td class="left bottom"></td>
                    <td class="top bottom"></td>
                    <td class="top bottom right"></td>
                    <td class="bottom right"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="top right bottom"></td>
                    <td class="bottom right"></td>
                    <td class="top right bottom"></td>
                    <td class="top left"></td>
                    <td class="left bottom right"></td>
                    <td class="top right"></td>
                    <td class="top bottom left"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="top left"></td>
                    <td class="left bottom"></td>
                    <td class="left right"></td>
                    <td class="left top"></td>
                    <td class="right bottom"></td>
                    <td class="left right"></td>
                    <td class="left bottom"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="top right bottom"></td>
                    <td class="top right"></td>
                    <td class="top right left"></td>
                    <td class="left top right"></td>
                    <td class="left top bottom"></td>
                    <td class="left right"></td>
                    <td class="top bottom left"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="left right"></td>
                    <td class="left right bottom"></td>
                    <td class="left right"></td>
                    <td class="top bottom"></td>
                    <td class="left right"></td>
                    <td class="left right"></td>
                    <td class="top right bottom"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="top right"></td>
                    <td class="top bottom"></td>
                    <td class="left top right"></td>
                    <td class="left right"></td>
                    <td class="left top right"></td>
                    <td class="left top"></td>
                    <td class="left top"></td>
                    <td class="empty"></td>
                </tr>
                <tr>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                    <td class="empty"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
