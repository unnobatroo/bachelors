<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Exam Practice</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      transition: background-color 0.2s ease;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 24px;
      max-width: 500px;
    }
    section {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 16px;
      margin-bottom: 12px;
    }
    button {
      cursor: pointer;
      padding: 4px 10px;
      margin-right: 4px;
    }
  </style>
</head>
<body>

  <!-- TASK 2: Sliders -->
  <div class="card">
    <h2>Task 2: HSL Color Sliders</h2>
    <form>
      Hue: <input type="range" min="0" max="360" value="0"> <br><br>
      Saturation: <input type="range" min="0" max="100" value="50"> <br><br>
      Lightness: <input type="range" min="0" max="100" value="50"> <br><br>
      <button type="button">Set background color</button> <br><br>
      HSL string: <input type="text" readonly>
    </form>
  </div>

  <!-- TASK 3: Contacts -->
  <div class="card">
    <h2>Task 3: Contacts List (Event Delegation)</h2>
    <div id="contacts">
      <section>
        <p class="name">Name: A</p>
        <p class="email" hidden>Email of A</p>
        <p class="address" hidden>Address of A</p>
        <p class="phone" hidden>Phone of A</p>
        <p>
          <button data-toggle="email">Email</button>
          <button data-toggle="address">Address</button>
          <button data-toggle="phone">Phone</button>
        </p>
      </section>

      <section>
        <p class="name">Name: B</p>
        <p class="email" hidden>Email of B</p>
        <p class="address" hidden>Address of B</p>
        <p class="phone" hidden>Phone of B</p>
        <p>
          <button data-toggle="email">Email</button>
          <button data-toggle="address">Address</button>
          <button data-toggle="phone">Phone</button>
        </p>
      </section>

      <section>
        <p class="name">Name: C</p>
        <p class="email" hidden>Email of C</p>
        <p class="address" hidden>Address of C</p>
        <p class="phone" hidden>Phone of C</p>
        <p>
          <button data-toggle="email">Email</button>
          <button data-toggle="address">Address</button>
          <button data-toggle="phone">Phone</button>
        </p>
      </section>
    </div>
  </div>

  <script src="solutions.js"></script>
</body>
</html>
